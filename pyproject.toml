[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snipzo"
version = "0.1.0"
description = "Turn long-form video into ready-to-post vertical Shorts."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Rachit Makwana", email = "rachitmakwana15@gmail.com" },
]
keywords = ["shorts", "video", "captions", "youtube", "ffmpeg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "pydantic-settings>=2.5",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]
pipeline = [
  "faster-whisper>=1.0",
  "scenedetect[opencv]>=0.6",
]

[project.scripts]
snipzo = "snipzo.cli:app"

[project.urls]
Repository = "https://github.com/Rachit7168/Snipzo"
Issues = "https://github.com/Rachit7168/Snipzo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snipzo = ["py.typed", "pick/prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["snipzo"]

[tool.mypy]
python_version = "3.11"
packages = ["snipzo"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "scenedetect", "scenedetect.*"]
ignore_missing_imports = true

